<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bitácora Café — Tu diario de catación de café. Registra, evalúa y descubre tus cafés favoritos." />
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#292524">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Playfair+Display:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline theme init: apply stored/OS preference BEFORE React hydrates -->
    <script>
      (function () {
        var theme = 'light';
        var hasStored = false;
        try {
          var stored = localStorage.getItem('bitacora-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
            hasStored = true;
          }
        } catch (e) {}
        if (!hasStored && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Critical dark-mode tokens: applied synchronously to prevent flash -->
    <style>
      [data-theme="dark"] {
        --color-background: #1C1917;
        --color-surface: #292524;
        --color-foreground: #F5F5F4;
        --color-muted: #3F3A36;
        --color-border: #44403C;
      }
    </style>

    <title>Bitácora Café</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
