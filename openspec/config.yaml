# openspec/config.yaml
schema: spec-driven

context: |
  Project: bitacora-dos-legados
  Type: Web app (coffee brewing log / notebook), later mobile
  Stack: TypeScript, Node.js (Hono 4.6), React 18 + Vite 6, Drizzle ORM 0.38, SQLite (better-sqlite3 11.7), Zod 3.24
  Architecture: Independent backend + frontend (decoupled monorepo)
  Testing: Vitest 4.1 — 43 tests (23 unit, 17 API integration, 3 service integration)
  Strict TDD: true

rules:
  proposal:
    - State business problem and target users explicitly
    - Define scope boundaries, non-goals, and first-slice limits
    - Include risk assessment and rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Write delta specs (ADDED / MODIFIED / REMOVED / RENAMED)
    - Keep specs domain-organized under openspec/specs/{domain}/
  design:
    - Include sequence diagrams or flow descriptions for complex flows
    - Document architecture decisions with rationale
    - Keep backend and frontend design separate
    - Define data models with Drizzle schema patterns
    - Plan API contract before frontend implementation
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate backend tasks from frontend tasks
    - Include Review Workload Forecast in task summary
  apply:
    - Follow existing code patterns once the codebase exists
    tdd: true
    test_command: "cd backend && npx vitest run"
  verify:
    test_command: "cd backend && npx vitest run"
    build_command: "cd frontend && npx tsc --noEmit && npx vite build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Merge delta specs into main spec under openspec/specs/

testing:
  strict_tdd: true
  detected: "2026-07-01"
  runner:
    command: "cd backend && npx vitest run"
    framework: "vitest"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: false
    type_checker: true
    formatter: false
